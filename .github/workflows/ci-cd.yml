name: Supply Chain Blockchain CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.19'
  NODE_VERSION: '16'

jobs:
  # Lint and test chaincode
  chaincode-test:
    name: Chaincode Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        working-directory: ./chaincode/go
        run: go mod download

      - name: Run golint
        working-directory: ./chaincode/go
        run: |
          go install golang.org/x/lint/golint@latest
          golint ./...

      - name: Run go vet
        working-directory: ./chaincode/go
        run: go vet ./...

      - name: Run tests
        working-directory: ./chaincode/go
        run: go test -v -cover ./...

  # Lint and test API
  api-test:
    name: API Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: supplychain_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/gateway-nodejs/package-lock.json

      - name: Install dependencies
        working-directory: ./apps/gateway-nodejs
        run: npm ci

      - name: Run ESLint
        working-directory: ./apps/gateway-nodejs
        run: npm run lint

      - name: Run tests
        working-directory: ./apps/gateway-nodejs
        run: npm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: supplychain_test
          DB_USER: postgres
          DB_PASSWORD: postgres

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          directory: ./apps/gateway-nodejs/coverage

  # Security scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: npm audit
        working-directory: ./apps/gateway-nodejs
        run: npm audit --audit-level=moderate

  # Build and package
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [chaincode-test, api-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Package chaincode
        working-directory: ./chaincode/go
        run: |
          go mod vendor
          tar -czf ../../supplychain_cc.tar.gz .

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build API
        working-directory: ./apps/gateway-nodejs
        run: |
          npm ci --production
          tar -czf ../../gateway-api.tar.gz .

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: |
            supplychain_cc.tar.gz
            gateway-api.tar.gz
          retention-days: 30

  # Deploy to development
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop'
    environment: development
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts

      - name: Deploy to dev server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_KEY }}
          SERVER_HOST: ${{ secrets.DEV_SERVER_HOST }}
          SERVER_USER: ${{ secrets.DEV_SERVER_USER }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key
          
          # Copy artifacts
          scp -i private_key -o StrictHostKeyChecking=no \
            supplychain_cc.tar.gz gateway-api.tar.gz \
            $SERVER_USER@$SERVER_HOST:/tmp/
          
          # Deploy
          ssh -i private_key -o StrictHostKeyChecking=no \
            $SERVER_USER@$SERVER_HOST << 'EOF'
            cd /opt/blockchain
            ./scripts/deploy-chaincode.sh /tmp/supplychain_cc.tar.gz
            ./scripts/deploy-api.sh /tmp/gateway-api.tar.gz
          EOF

      - name: Health check
        run: |
          sleep 30
          curl -f https://dev-api.example.com/health || exit 1

  # Deploy to production
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          draft: false
          prerelease: false

      - name: Deploy to production
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_KEY }}
          SERVER_HOST: ${{ secrets.PROD_SERVER_HOST }}
          SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key
          
          # Backup current version
          ssh -i private_key -o StrictHostKeyChecking=no \
            $SERVER_USER@$SERVER_HOST \
            "cd /opt/blockchain && ./scripts/backup.sh"
          
          # Copy artifacts
          scp -i private_key -o StrictHostKeyChecking=no \
            supplychain_cc.tar.gz gateway-api.tar.gz \
            $SERVER_USER@$SERVER_HOST:/tmp/
          
          # Deploy with zero downtime
          ssh -i private_key -o StrictHostKeyChecking=no \
            $SERVER_USER@$SERVER_HOST << 'EOF'
            cd /opt/blockchain
            ./scripts/deploy-chaincode.sh /tmp/supplychain_cc.tar.gz
            ./scripts/deploy-api-zero-downtime.sh /tmp/gateway-api.tar.gz
          EOF

      - name: Health check
        run: |
          sleep 30
          curl -f https://api.example.com/health || exit 1

      - name: Rollback on failure
        if: failure()
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_KEY }}
          SERVER_HOST: ${{ secrets.PROD_SERVER_HOST }}
          SERVER_USER: ${{ secrets.PROD_SERVER_USER }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key
          
          ssh -i private_key -o StrictHostKeyChecking=no \
            $SERVER_USER@$SERVER_HOST \
            "cd /opt/blockchain && ./scripts/rollback.sh"

      - name: Notify deployment
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Production deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
