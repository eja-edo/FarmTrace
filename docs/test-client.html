<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Realtime Monitor - Test Client</title>
    <script src="https://cdn.socket.io/4.7.0/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .status.connected {
            background: #10b981;
            color: white;
        }

        .status.disconnected {
            background: #ef4444;
            color: white;
        }

        .config {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .event {
            padding: 10px;
            border-left: 4px solid #667eea;
            background: #f9fafb;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .event.alert {
            border-left-color: #ef4444;
            background: #fee;
        }

        .event .time {
            font-size: 12px;
            color: #6b7280;
        }

        .event .value {
            font-weight: bold;
            color: #111827;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat .number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .stat .label {
            color: #6b7280;
            font-size: 14px;
        }

        .empty {
            color: #9ca3af;
            text-align: center;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🚀 IoT Realtime Monitor</h1>
            <span class="status disconnected" id="status">🔴 Disconnected</span>
        </div>

        <div class="config">
            <h2>Connection Settings</h2>
            <div class="form-group">
                <label for="serverUrl">Server URL:</label>
                <input type="text" id="serverUrl" value="http://localhost:3000">
            </div>
            <div class="form-group">
                <label for="deviceId">Device ID:</label>
                <input type="text" id="deviceId" value="esp32-001" placeholder="esp32-001">
            </div>
            <div class="form-group">
                <label for="token">JWT Token:</label>
                <input type="text" id="token" placeholder="Paste your JWT token here">
            </div>
            <button id="connectBtn">Connect</button>
            <button id="disconnectBtn" disabled>Disconnect</button>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="number" id="sensorCount">0</div>
                <div class="label">Sensor Readings</div>
            </div>
            <div class="stat">
                <div class="number" id="locationCount">0</div>
                <div class="label">Location Updates</div>
            </div>
            <div class="stat">
                <div class="number" id="alertCount">0</div>
                <div class="label">Alerts</div>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <h2>📊 Sensor Readings</h2>
                <div id="sensorList" class="empty">No data yet. Waiting for events...</div>
            </div>

            <div class="card">
                <h2>📍 Location Updates</h2>
                <div id="locationList" class="empty">No data yet. Waiting for events...</div>
            </div>

            <div class="card">
                <h2>🚨 Alerts</h2>
                <div id="alertList" class="empty">No alerts yet.</div>
            </div>
        </div>
    </div>

    <script>
        let socket = null;
        let counts = {
            sensor: 0,
            location: 0,
            alert: 0
        };

        const elements = {
            status: document.getElementById('status'),
            connectBtn: document.getElementById('connectBtn'),
            disconnectBtn: document.getElementById('disconnectBtn'),
            serverUrl: document.getElementById('serverUrl'),
            deviceId: document.getElementById('deviceId'),
            token: document.getElementById('token'),
            sensorCount: document.getElementById('sensorCount'),
            locationCount: document.getElementById('locationCount'),
            alertCount: document.getElementById('alertCount'),
            sensorList: document.getElementById('sensorList'),
            locationList: document.getElementById('locationList'),
            alertList: document.getElementById('alertList')
        };

        elements.connectBtn.addEventListener('click', connect);
        elements.disconnectBtn.addEventListener('click', disconnect);

        function connect() {
            const serverUrl = elements.serverUrl.value.trim();
            const deviceId = elements.deviceId.value.trim();
            const token = elements.token.value.trim();

            if (!token) {
                alert('Please enter a JWT token');
                return;
            }

            console.log('Connecting to', serverUrl);

            socket = io(serverUrl, {
                auth: { token },
                transports: ['websocket', 'polling']
            });

            socket.on('connect', () => {
                console.log('Connected!', socket.id);
                updateStatus(true);
                socket.emit('join', { devices: [deviceId] });
                elements.connectBtn.disabled = true;
                elements.disconnectBtn.disabled = false;
            });

            socket.on('joined', (data) => {
                console.log('Joined rooms:', data);
            });

            socket.on('disconnect', (reason) => {
                console.log('Disconnected:', reason);
                updateStatus(false);
                elements.connectBtn.disabled = false;
                elements.disconnectBtn.disabled = true;
            });

            socket.on('connect_error', (error) => {
                console.error('Connection error:', error.message);
                alert('Connection error: ' + error.message);
                updateStatus(false);
            });

            socket.on('sensor_reading', (data) => {
                counts.sensor++;
                elements.sensorCount.textContent = counts.sensor;
                addEvent('sensor', data);
            });

            socket.on('device_location', (data) => {
                counts.location++;
                elements.locationCount.textContent = counts.location;
                addEvent('location', data);
            });

            socket.on('alert', (data) => {
                counts.alert++;
                elements.alertCount.textContent = counts.alert;
                addEvent('alert', data);
            });
        }

        function disconnect() {
            if (socket) {
                socket.close();
                socket = null;
            }
        }

        function updateStatus(connected) {
            if (connected) {
                elements.status.textContent = '🟢 Connected';
                elements.status.className = 'status connected';
            } else {
                elements.status.textContent = '🔴 Disconnected';
                elements.status.className = 'status disconnected';
            }
        }

        function addEvent(type, data) {
            let container, html;
            const time = new Date(data.createdAt).toLocaleTimeString();

            switch (type) {
                case 'sensor':
                    container = elements.sensorList;
                    html = `
            <div class="event">
              <div class="time">${time}</div>
              <div class="value">${data.type}: ${data.value.toFixed(2)}</div>
            </div>
          `;
                    break;

                case 'location':
                    container = elements.locationList;
                    html = `
            <div class="event">
              <div class="time">${time}</div>
              <div class="value">
                Lat: ${data.latitude.toFixed(6)}<br>
                Lon: ${data.longitude.toFixed(6)}
              </div>
            </div>
          `;
                    break;

                case 'alert':
                    container = elements.alertList;
                    html = `
            <div class="event alert">
              <div class="time">${time}</div>
              <div class="value">⚠️ ${data.type}: ${data.value.toFixed(2)}</div>
            </div>
          `;
                    break;
            }

            if (container.classList.contains('empty')) {
                container.innerHTML = '';
                container.classList.remove('empty');
            }

            container.insertAdjacentHTML('afterbegin', html);

            // Keep only last 10 events
            while (container.children.length > 10) {
                container.removeChild(container.lastChild);
            }
        }
    </script>
</body>

</html>
