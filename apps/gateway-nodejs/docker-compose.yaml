  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #     - ../../offchain/postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
  #   networks:
  #     - fabric_supplychain
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U supplychain"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  fabric_supplychain:
    external: true

volumes:
  postgres-data:
    driver: local
