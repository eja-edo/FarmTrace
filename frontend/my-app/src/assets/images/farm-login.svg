<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#90EE90;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky background -->
  <rect width="400" height="200" fill="url(#skyGradient)"/>
  
  <!-- Field background -->
  <rect x="0" y="200" width="400" height="100" fill="url(#fieldGradient)"/>
  
  <!-- Sun -->
  <circle cx="320" cy="60" r="30" fill="#FFD700" opacity="0.9"/>
  
  <!-- Clouds -->
  <ellipse cx="80" cy="50" rx="25" ry="15" fill="white" opacity="0.8"/>
  <ellipse cx="100" cy="50" rx="30" ry="18" fill="white" opacity="0.8"/>
  <ellipse cx="120" cy="50" rx="20" ry="12" fill="white" opacity="0.8"/>
  
  <ellipse cx="250" cy="40" rx="20" ry="12" fill="white" opacity="0.7"/>
  <ellipse cx="270" cy="40" rx="25" ry="15" fill="white" opacity="0.7"/>
  <ellipse cx="290" cy="40" rx="18" ry="10" fill="white" opacity="0.7"/>
  
  <!-- Trees -->
  <rect x="50" y="180" width="8" height="40" fill="#8B4513"/>
  <ellipse cx="54" cy="170" rx="20" ry="25" fill="#228B22"/>
  
  <rect x="100" y="185" width="6" height="35" fill="#8B4513"/>
  <ellipse cx="103" cy="175" rx="15" ry="20" fill="#32CD32"/>
  
  <rect x="150" y="190" width="7" height="30" fill="#8B4513"/>
  <ellipse cx="153.5" cy="180" rx="18" ry="22" fill="#228B22"/>
  
  <!-- Farm buildings -->
  <rect x="200" y="160" width="60" height="40" fill="#DEB887"/>
  <polygon points="200,160 230,140 260,160" fill="#8B4513"/>
  <rect x="210" y="175" width="8" height="25" fill="#654321"/>
  <rect x="225" y="170" width="10" height="8" fill="#87CEEB"/>
  
  <!-- Crops/Plants -->
  <g fill="#228B22">
    <!-- Row 1 -->
    <ellipse cx="80" cy="220" rx="3" ry="8"/>
    <ellipse cx="90" cy="220" rx="3" ry="8"/>
    <ellipse cx="100" cy="220" rx="3" ry="8"/>
    <ellipse cx="110" cy="220" rx="3" ry="8"/>
    <ellipse cx="120" cy="220" rx="3" ry="8"/>
    
    <!-- Row 2 -->
    <ellipse cx="75" cy="235" rx="3" ry="8"/>
    <ellipse cx="85" cy="235" rx="3" ry="8"/>
    <ellipse cx="95" cy="235" rx="3" ry="8"/>
    <ellipse cx="105" cy="235" rx="3" ry="8"/>
    <ellipse cx="115" cy="235" rx="3" ry="8"/>
    <ellipse cx="125" cy="235" rx="3" ry="8"/>
    
    <!-- Row 3 -->
    <ellipse cx="70" cy="250" rx="3" ry="8"/>
    <ellipse cx="80" cy="250" rx="3" ry="8"/>
    <ellipse cx="90" cy="250" rx="3" ry="8"/>
    <ellipse cx="100" cy="250" rx="3" ry="8"/>
    <ellipse cx="110" cy="250" rx="3" ry="8"/>
    <ellipse cx="120" cy="250" rx="3" ry="8"/>
    <ellipse cx="130" cy="250" rx="3" ry="8"/>
  </g>
  
  <!-- IoT Sensor/Tower -->
  <rect x="300" y="150" width="4" height="50" fill="#C0C0C0"/>
  <rect x="295" y="150" width="14" height="8" fill="#4169E1"/>
  <circle cx="302" cy="154" r="2" fill="#FFD700"/>
  
  <!-- Windmill -->
  <rect x="350" y="170" width="6" height="30" fill="#8B4513"/>
  <circle cx="353" cy="170" r="15" fill="#F5F5F5" stroke="#C0C0C0" stroke-width="1"/>
  <line x1="353" y1="155" x2="353" y2="185" stroke="#C0C0C0" stroke-width="2"/>
  <line x1="338" y1="170" x2="368" y2="170" stroke="#C0C0C0" stroke-width="2"/>
  
  <!-- Tractor -->
  <rect x="280" y="220" width="25" height="12" fill="#FF6347" rx="2"/>
  <circle cx="285" cy="235" r="4" fill="#2F4F4F"/>
  <circle cx="300" cy="235" r="4" fill="#2F4F4F"/>
  <rect x="275" y="225" width="8" height="6" fill="#FFD700"/>
</svg>
