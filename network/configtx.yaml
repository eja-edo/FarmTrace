---
################################################################################
#
#   Section: Organizations
#
################################################################################
Organizations:
    - &OrdererOrg
        Name: OrdererOrg
        ID: OrdererMSP
        MSPDir: crypto-config/ordererOrganizations/example.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('OrdererMSP.member')"
            Writers:
                Type: Signature
                Rule: "OR('OrdererMSP.member')"
            Admins:
                Type: Signature
                Rule: "OR('OrdererMSP.admin')"
        OrdererEndpoints:
            - orderer.example.com:7050
            - orderer2.example.com:8050
            - orderer3.example.com:9050

    - &OrgManufacturer
        Name: OrgManufacturerMSP
        ID: OrgManufacturerMSP
        MSPDir: crypto-config/peerOrganizations/manufacturer.example.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('OrgManufacturerMSP.admin', 'OrgManufacturerMSP.peer', 'OrgManufacturerMSP.client')"
            Writers:
                Type: Signature
                Rule: "OR('OrgManufacturerMSP.admin', 'OrgManufacturerMSP.client')"
            Admins:
                Type: Signature
                Rule: "OR('OrgManufacturerMSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('OrgManufacturerMSP.peer')"
        AnchorPeers:
            - Host: peer0.manufacturer.example.com
              Port: 7051

    - &OrgShipper
        Name: OrgShipperMSP
        ID: OrgShipperMSP
        MSPDir: crypto-config/peerOrganizations/shipper.example.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('OrgShipperMSP.admin', 'OrgShipperMSP.peer', 'OrgShipperMSP.client')"
            Writers:
                Type: Signature
                Rule: "OR('OrgShipperMSP.admin', 'OrgShipperMSP.client')"
            Admins:
                Type: Signature
                Rule: "OR('OrgShipperMSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('OrgShipperMSP.peer')"
        AnchorPeers:
            - Host: peer0.shipper.example.com
              Port: 8051

    - &OrgWarehouse
        Name: OrgWarehouseMSP
        ID: OrgWarehouseMSP
        MSPDir: crypto-config/peerOrganizations/warehouse.example.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('OrgWarehouseMSP.admin', 'OrgWarehouseMSP.peer', 'OrgWarehouseMSP.client')"
            Writers:
                Type: Signature
                Rule: "OR('OrgWarehouseMSP.admin', 'OrgWarehouseMSP.client')"
            Admins:
                Type: Signature
                Rule: "OR('OrgWarehouseMSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('OrgWarehouseMSP.peer')"
        AnchorPeers:
            - Host: peer0.warehouse.example.com
              Port: 9051

    - &OrgRetailer
        Name: OrgRetailerMSP
        ID: OrgRetailerMSP
        MSPDir: crypto-config/peerOrganizations/retailer.example.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('OrgRetailerMSP.admin', 'OrgRetailerMSP.peer', 'OrgRetailerMSP.client')"
            Writers:
                Type: Signature
                Rule: "OR('OrgRetailerMSP.admin', 'OrgRetailerMSP.client')"
            Admins:
                Type: Signature
                Rule: "OR('OrgRetailerMSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('OrgRetailerMSP.peer')"
        AnchorPeers:
            - Host: peer0.retailer.example.com
              Port: 10051

################################################################################
#
#   SECTION: Capabilities
#
################################################################################
Capabilities:
    Channel: &ChannelCapabilities
        V2_0: true
    Orderer: &OrdererCapabilities
        V2_0: true
    Application: &ApplicationCapabilities
        V2_0: true

################################################################################
#
#   SECTION: Application
#
################################################################################
Application: &ApplicationDefaults
    Organizations:
    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
        LifecycleEndorsement:
            Type: ImplicitMeta
            Rule: "MAJORITY Endorsement"
        Endorsement:
            Type: ImplicitMeta
            Rule: "MAJORITY Endorsement"
    Capabilities:
        <<: *ApplicationCapabilities

################################################################################
#
#   SECTION: Orderer
#
################################################################################
Orderer: &OrdererDefaults
    OrdererType: etcdraft
    Addresses:
        - orderer.example.com:7050
        - orderer2.example.com:8050
        - orderer3.example.com:9050
    EtcdRaft:
        Consenters:
        - Host: orderer.example.com
          Port: 7050
          ClientTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
          ServerTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
        - Host: orderer2.example.com
          Port: 8050
          ClientTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer2.example.com/tls/server.crt
          ServerTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer2.example.com/tls/server.crt
        - Host: orderer3.example.com
          Port: 9050
          ClientTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer3.example.com/tls/server.crt
          ServerTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer3.example.com/tls/server.crt
    BatchTimeout: 2s
    BatchSize:
        MaxMessageCount: 10
        AbsoluteMaxBytes: 99 MB
        PreferredMaxBytes: 512 KB
    Organizations:
    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
        BlockValidation:
            Type: ImplicitMeta
            Rule: "ANY Writers"

################################################################################
#
#   CHANNEL
#
################################################################################
Channel: &ChannelDefaults
    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
    Capabilities:
        <<: *ChannelCapabilities

################################################################################
#
#   Profile
#
################################################################################
Profiles:
    SupplyChainOrdererGenesis:
        <<: *ChannelDefaults
        Orderer:
            <<: *OrdererDefaults
            Organizations:
                - *OrdererOrg
            Capabilities:
                <<: *OrdererCapabilities
        Consortiums:
            SupplyChainConsortium:
                Organizations:
                    - *OrgManufacturer
                    - *OrgShipper
                    - *OrgWarehouse
                    - *OrgRetailer

    SupplyChainChannel:
        Consortium: SupplyChainConsortium
        <<: *ChannelDefaults
        Application:
            <<: *ApplicationDefaults
            Organizations:
                - *OrgManufacturer
                - *OrgShipper
                - *OrgWarehouse
                - *OrgRetailer
            Capabilities:
                <<: *ApplicationCapabilities
